[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uipath-ipc"
version = "0.1.0"
description = "Python IPC library compatible with UiPath CoreIpc wire protocol. Supports RPC over Named Pipes and TCP."
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["src/uipath_ipc"]
