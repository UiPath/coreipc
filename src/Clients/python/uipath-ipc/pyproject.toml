[project]
name = "uipath-ipc"
version = "0.2.0"
description = "Python client for UiPath.Ipc — an interface-based RPC framework over Named Pipes, TCP, and WebSockets."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Eduard Dumitru", email = "eduard.dumitru@uipath.com" },
]

dependencies = [
    # Type-directed (de)serialization (wire/serialization.py). Wide range so a
    # consumer is free to pin their own 2.x; we only use the stable public
    # surface (TypeAdapter, to_jsonable_python, Base64Bytes).
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "debugpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uipath_ipc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that talk to a real .NET server (skip with --no-integration)",
]
