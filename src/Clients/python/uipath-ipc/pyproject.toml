[project]
name = "uipath-ipc"
version = "0.1.0"
description = "Python client for UiPath.Ipc — an interface-based RPC framework over Named Pipes, TCP, and WebSockets."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Eduard Dumitru", email = "eduard.dumitru@uipath.com" },
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
