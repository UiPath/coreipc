[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coreipc"
version = "0.1.0"
description = "Python port of UiPath.CoreIpc — async IPC client and server, wire-compatible with the C# and TypeScript peers."
requires-python = ">=3.11"
authors = [{ name = "UiPath" }]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["coreipc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
