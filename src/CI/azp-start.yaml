# =====================================================================
# CI pipeline — always builds & tests everything, no parameters.
# =====================================================================
# Kept at this path (azp-start.yaml) on purpose: the existing CI pipeline
# definition already points here, and the path resolves on EVERY branch, so
# CI transitions cleanly as branches merge — no repointing, no "YAML file not
# found". The file's *content* is what changes (the old combined build+publish
# pipeline is retired): build/test only, publishing moved to azp-publish.yaml.
#
# Builds NuGet (.NET), NPM (Node + Web) and Python in parallel, runs their
# tests, and publishes each as a pipeline artifact:
#   'NuGet package' / 'NPM package' / 'Python package'.
#
# Pushes to NO feed. Publishing is the separate, manual Publish pipeline
# (azp-publish.yaml): it takes a CI build id and pushes that build's artifacts
# to the feeds behind approval-gated environments.
#
# Triggers: configure in Azure DevOps (CI on push). The Publish pipeline is
# manual-only.
# =====================================================================

name: $(Date:yyyyMMdd)$(Rev:-rr)

variables:
  SCG_KILL_SWITCH: 'true' # Because our integration with the Aikido Safe Chain pipeline decorator (SGC rollout) is still buggy: https://uipath-product.slack.com/archives/CMCKWF5TR/p1780002214456709
  Label_Initialization: 'Initialization:'
  Label_DotNet: '.NET:'
  Label_NodeJS: 'node.js:'

  DotNet_BuildConfiguration: 'Release'
  DotNet_SessionSolution: './src/CoreIpc.sln'
  DotNet_MainProjectName: 'UiPath.CoreIpc'
  DotNet_MainProjectPath: './src/UiPath.CoreIpc/UiPath.CoreIpc.csproj'
  DotNet_ArtifactName: 'NuGet package'

  NodeJS_DotNet_BuildConfiguration: 'Debug'
  NodeJS_ProjectPath: './src/Clients/js'
  NodeJS_ArchivePath: './src/Clients/js/dist/pack/nodejs.zip'
  NodeJS_ArtifactName: 'NPM package'
  NodeJS_NetCoreAppTargetDir_RelativePath: 'dotnet/UiPath.CoreIpc.NodeInterop/bin/Debug/net6.0'
  NodeJS_DotNetNodeInteropProject : './src/Clients/js/dotnet/UiPath.CoreIpc.NodeInterop/UiPath.CoreIpc.NodeInterop.csproj'
  NodeJS_DotNetNodeInteropSolution: './src/Clients/js/dotnet/UiPath.CoreIpc.NodeInterop.sln'

stages:
# Build stages — one per technology, all run in parallel (`dependsOn: []`).
- stage: Build_NuGet
  displayName: '🏭 Build NuGet'
  dependsOn: []
  jobs:
  - job: NuGet_DotNet_Windows
    displayName: 'NuGet — .NET on Windows'
    pool:
        vmImage: 'windows-2022'
    steps:
      - template: azp-initialization.yaml
      - template: azp-dotnet.yaml
      - template: azp-dotnet-dist.yaml

- stage: Build_NPM
  displayName: '🏭 Build NPM'
  dependsOn: []
  jobs:
  - job: NPM_Node_Web_Windows
    displayName: 'NPM — Node + Web on Windows'
    pool:
        vmImage: 'windows-2022'
    steps:
      - template: azp-initialization.yaml
      - template: azp-nodejs.yaml
      - template: azp-nodejs-dist.yaml

  - job: NPM_Node_Web_Linux
    displayName: 'NPM — Node + Web on Linux (test-only)'
    pool:
      vmImage: 'ubuntu-22.04'
    steps:
      - template: azp-initialization.yaml
      - template: azp-nodejs.yaml

- stage: Build_Python
  displayName: '🏭 Build Python'
  dependsOn: []
  jobs:
  - job: Python_Windows
    displayName: 'Python — Windows'
    pool:
        vmImage: 'windows-2022'
    steps:
      - template: azp-initialization.yaml
      - template: azp-python.yaml
      - template: azp-python-dist.yaml

  - job: Python_Linux
    displayName: 'Python — Linux (test-only)'
    pool:
      vmImage: 'ubuntu-22.04'
    # Test the declared floor (requires-python >= 3.10) and the versions in
    # between — the asyncio.wait_for scheduling changed in 3.12, which a
    # 3.12-only matrix can't catch.
    strategy:
      matrix:
        py310: { pythonVersion: '3.10' }
        py311: { pythonVersion: '3.11' }
        py312: { pythonVersion: '3.12' }
    steps:
      - template: azp-initialization.yaml
      - template: azp-python.yaml
        parameters:
          pythonVersion: $(pythonVersion)
