name: $(Date:yyyyMMdd)$(Rev:-rr)

parameters:
  - name: publishNuGet
    displayName: 'Publish NuGet package to UiPath-Internal feed'
    type: boolean
    default: false

  - name: publishNpm
    displayName: 'Publish NPM packages (Node + Web) to uipath-ipc-deps (+ GitHub Packages best-effort)'
    type: boolean
    default: false

  - name: publishPyPI
    displayName: 'Publish Python package (wheel + sdist) to uipath-ipc-deps'
    type: boolean
    default: false

  - name: reuseArtifactsFromBuildId
    displayName: 'Reuse artifacts from build ID (0 = no, run Build normally)'
    type: string
    default: '0'

variables:
  SCG_KILL_SWITCH: 'true' # Because our integration with the Aikido Safe Chain pipeline decorator (SGC rollout) is still buggy: https://uipath-product.slack.com/archives/CMCKWF5TR/p1780002214456709
  Label_Initialization: 'Initialization:'
  Label_DotNet: '.NET:'
  Label_NodeJS: 'node.js:'

  DotNet_BuildConfiguration: 'Release'
  DotNet_SessionSolution: './src/CoreIpc.sln'
  DotNet_MainProjectName: 'UiPath.CoreIpc'
  DotNet_MainProjectPath: './src/UiPath.CoreIpc/UiPath.CoreIpc.csproj'
  DotNet_ArtifactName: 'NuGet package'

  NodeJS_DotNet_BuildConfiguration: 'Debug'
  NodeJS_ProjectPath: './src/Clients/js'
  NodeJS_ArchivePath: './src/Clients/js/dist/pack/nodejs.zip'
  NodeJS_ArtifactName: 'NPM package'
  NodeJS_NetCoreAppTargetDir_RelativePath: 'dotnet/UiPath.CoreIpc.NodeInterop/bin/Debug/net6.0'
  NodeJS_DotNetNodeInteropProject : './src/Clients/js/dotnet/UiPath.CoreIpc.NodeInterop/UiPath.CoreIpc.NodeInterop.csproj'
  NodeJS_DotNetNodeInteropSolution: './src/Clients/js/dotnet/UiPath.CoreIpc.NodeInterop.sln'

stages:
# ---------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------
# Skipped when `reuseArtifactsFromBuildId` is set — in that case the
# Publish stages pull their artifacts from the specified prior build
# instead of running Build here.
# ---------------------------------------------------------------------
- stage: Build
  displayName: '🏭 Build'
  # '0' (default) or '' both mean "no reuse — run Build normally".
  condition: in('${{ parameters.reuseArtifactsFromBuildId }}', '0', '')
  jobs:
  # The following 3 jobs will run in parallel.
  - job: NuGet_DotNet_Windows
    displayName: 'NuGet — .NET on Windows'
    pool:
        vmImage: 'windows-2022'
    steps:
      - template: azp-initialization.yaml
      - template: azp-dotnet.yaml
      - template: azp-dotnet-dist.yaml

  - job: NPM_Node_Web_Windows
    displayName: 'NPM — Node + Web on Windows'
    pool:
        vmImage: 'windows-2022'
    steps:
      - template: azp-initialization.yaml
      - template: azp-nodejs.yaml
      - template: azp-nodejs-dist.yaml

  - job: NPM_Node_Web_Linux
    displayName: 'NPM — Node + Web on Linux (test-only)'
    pool:
      vmImage: 'ubuntu-22.04'
    steps:
      - template: azp-initialization.yaml
      - template: azp-nodejs.yaml

  - job: Python_Windows
    displayName: 'Python — Windows'
    pool:
        vmImage: 'windows-2022'
    steps:
      - template: azp-python.yaml
      - template: azp-python-dist.yaml

  - job: Python_Linux
    displayName: 'Python — Linux (test-only)'
    pool:
      vmImage: 'ubuntu-22.04'
    steps:
      - template: azp-python.yaml

# ---------------------------------------------------------------------
# Publish — NuGet
# ---------------------------------------------------------------------
# The whole stage is omitted at compile time when `publishNuGet` is
# false — so a default CI run has no "Publish NuGet" entry in the UI
# at all, and the rejection-as-failure footgun is impossible. When
# it does run, approval is gated by the `NuGet-Packages` environment.
# ---------------------------------------------------------------------
- ${{ if eq(parameters.publishNuGet, true) }}:
  - stage: Publish_NuGet
    displayName: '🚚 Publish NuGet'
    dependsOn: Build
    # Build can legitimately be Skipped (reuseArtifactsFromBuildId set);
    # we still want Publish to proceed in that case.
    condition: in(dependencies.Build.result, 'Succeeded', 'Skipped')
    jobs:
    - deployment: Publish_NuGet_Package
      displayName: '📦 Publish NuGet to UiPath-Internal'
      environment: 'NuGet-Packages'
      pool:
        vmImage: 'windows-2022'
      strategy:
        runOnce:
          deploy:
            steps:
              - template: azp-nuget.publish.steps.yaml
                parameters:
                  reuseArtifactsFromBuildId: ${{ parameters.reuseArtifactsFromBuildId }}

# ---------------------------------------------------------------------
# Publish — NPM
# ---------------------------------------------------------------------
# Same shape as Publish_NuGet, gated on `publishNpm`.
# ---------------------------------------------------------------------
- ${{ if eq(parameters.publishNpm, true) }}:
  - stage: Publish_NPM
    displayName: '🚚 Publish NPM'
    dependsOn: Build
    condition: in(dependencies.Build.result, 'Succeeded', 'Skipped')
    jobs:
    - deployment: Publish_NPM_Packages
      displayName: '📦 Publish NPM (Node + Web)'
      environment: 'NPM-Packages'
      pool:
        vmImage: ubuntu-latest
      strategy:
        runOnce:
          deploy:
            steps:
              - template: azp-js.publish-npm.steps.yaml
                parameters:
                  reuseArtifactsFromBuildId: ${{ parameters.reuseArtifactsFromBuildId }}

# ---------------------------------------------------------------------
# Publish — PyPI
# ---------------------------------------------------------------------
# Same shape as Publish_NuGet / Publish_NPM, gated on `publishPyPI`.
# Pushes the wheel + sdist to the project-scoped Azure Artifacts feed
# `uipath-ipc-deps` (PyPI upstream/downstream already configured).
# ---------------------------------------------------------------------
- ${{ if eq(parameters.publishPyPI, true) }}:
  - stage: Publish_PyPI
    displayName: '🚚 Publish PyPI'
    dependsOn: Build
    condition: in(dependencies.Build.result, 'Succeeded', 'Skipped')
    jobs:
    - deployment: Publish_PyPI_Package
      displayName: '📦 Publish Python wheel + sdist to uipath-ipc-deps'
      environment: 'PyPI-Packages'
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
              - template: azp-python.publish.steps.yaml
                parameters:
                  reuseArtifactsFromBuildId: ${{ parameters.reuseArtifactsFromBuildId }}
