# =====================================================================
# Publish pipeline — pushes a CI build's artifacts to the feeds.
# =====================================================================
# Run on demand. Takes the id of a completed CI build (azp-start.yaml run),
# downloads that build's artifacts, and publishes the selected packages
# behind their approval-gated environments. Builds nothing itself.
#
# Parameters:
#   - buildId               (required) the CI build/run id to publish from.
#   - publishNuGet / publishNpm / publishPython  (default: all on) — which
#     packages to publish to the INTERNAL (UiPath-Internal) feeds.
#   - publishToPublicPyPI   (default off) — ALSO publish Python to PUBLIC PyPI
#     (master builds only; via the GitHub Action). Separate from publishPython
#     so you can publish internally without touching public PyPI.
#
# The `ci` pipeline resource below is hardcoded to the CI pipeline (named
# "CI", running azp-start.yaml). It resolves the CI definition id for the
# artifact download (and grants cross-pipeline artifact access); the specific
# run is always the `buildId` parameter.
# =====================================================================

name: $(Date:yyyyMMdd)$(Rev:-rr)

trigger: none      # manual only — this pipeline is run on demand with parameters
pr: none

parameters:
  - name: buildId
    displayName: 'CI build (run) id to publish artifacts from (required)'
    type: string

  - name: publishNuGet
    displayName: 'Publish NuGet → UiPath-Internal'
    type: boolean
    default: true

  - name: publishNpm
    displayName: 'Publish NPM (Node + Web) → uipath-ipc-deps (+ GitHub Packages best-effort)'
    type: boolean
    default: true

  - name: publishPython
    displayName: 'Publish Python (wheel + sdist) → UiPath-Internal'
    type: boolean
    default: true

  - name: publishToPublicPyPI
    displayName: 'ALSO publish Python → PUBLIC PyPI (master builds only)'
    type: boolean
    default: false

resources:
  pipelines:
    - pipeline: ci          # referenced as $(resources.pipeline.ci.pipelineID)
      source: 'CI'          # the CI pipeline (azp-start.yaml) — hardcoded
      trigger: none

variables:
  # Defensive: keep the Supply Chain Guard shim disabled here too (see the
  # detailed note in azp-nodejs.yaml). Publish does not run `npm install`, but
  # this keeps both pipelines consistent.
  SCG_KILL_SWITCH: 'true'

stages:
# =====================================================================
# Input validation (compile-time). Each guard emits a fail-fast stage so a
# bad/empty invocation surfaces a clear error instead of silently doing
# nothing. '0' is treated as "not provided" (legacy sentinel).
# =====================================================================
- ${{ if in(parameters.buildId, '', '0') }}:
  - stage: Invalid_Input
    displayName: '❌ buildId required'
    jobs:
    - job: error
      pool:
        vmImage: 'ubuntu-latest'
      steps:
      - checkout: none
      - script: |
          echo "##vso[task.logissue type=error]'buildId' is required: enter the CI build (run) id whose artifacts you want to publish."
          exit 1
        displayName: 'buildId is required'

- ${{ if not(or(eq(parameters.publishNuGet, true), eq(parameters.publishNpm, true), eq(parameters.publishPython, true), eq(parameters.publishToPublicPyPI, true))) }}:
  - stage: Nothing_Selected
    displayName: '❌ Nothing selected'
    jobs:
    - job: error
      pool:
        vmImage: 'ubuntu-latest'
      steps:
      - checkout: none
      - script: |
          echo "##vso[task.logissue type=error]Select at least one target (NuGet, NPM, Python, or public PyPI)."
          exit 1
        displayName: 'At least one target required'

# =====================================================================
# Publish stages — only emitted when a real buildId was provided. Each runs
# independently (dependsOn: []) behind its approval-gated environment, and
# pulls the artifact from the CI build:
#   reuseArtifactsFromBuildId = the buildId run
#   sourcePipelineId          = the CI pipeline definition (via the resource)
# `- download: none` suppresses the deployment job's implicit artifact
# download (the publish step template downloads exactly what it needs).
# =====================================================================
- ${{ if and(not(in(parameters.buildId, '', '0')), eq(parameters.publishNuGet, true)) }}:
  - stage: Publish_NuGet
    displayName: '🚚 Publish NuGet → UiPath-Internal'
    dependsOn: []
    jobs:
    - deployment: Publish_NuGet_Package
      displayName: '📦 Publish NuGet to UiPath-Internal'
      environment: 'NuGet-Packages'
      pool:
        vmImage: 'windows-2022'
      strategy:
        runOnce:
          deploy:
            steps:
              - download: none
              - template: azp-nuget.publish.steps.yaml
                parameters:
                  reuseArtifactsFromBuildId: ${{ parameters.buildId }}
                  sourcePipelineId: $(resources.pipeline.ci.pipelineID)

- ${{ if and(not(in(parameters.buildId, '', '0')), eq(parameters.publishNpm, true)) }}:
  - stage: Publish_NPM
    displayName: '🚚 Publish NPM → uipath-ipc-deps'
    dependsOn: []
    jobs:
    - deployment: Publish_NPM_Packages
      displayName: '📦 Publish NPM (Node + Web)'
      environment: 'NPM-Packages'
      pool:
        vmImage: ubuntu-latest
      strategy:
        runOnce:
          deploy:
            steps:
              - download: none
              - template: azp-js.publish-npm.steps.yaml
                parameters:
                  reuseArtifactsFromBuildId: ${{ parameters.buildId }}
                  sourcePipelineId: $(resources.pipeline.ci.pipelineID)

# Publish Python to the INTERNAL feed (UiPath-Internal). NOT public PyPI —
# that is the separate publishToPublicPyPI lever + Publish_PublicPyPI stage below.
- ${{ if and(not(in(parameters.buildId, '', '0')), eq(parameters.publishPython, true)) }}:
  - stage: Publish_Python
    displayName: '🚚 Publish Python → UiPath-Internal'
    dependsOn: []
    jobs:
    - deployment: Publish_Python_Package
      displayName: '📦 Publish Python wheel + sdist to UiPath-Internal'
      environment: 'PyPI-Packages'
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
              - download: none
              - template: azp-python.publish.steps.yaml
                parameters:
                  reuseArtifactsFromBuildId: ${{ parameters.buildId }}
                  sourcePipelineId: $(resources.pipeline.ci.pipelineID)

# =====================================================================
# Publish Python to PUBLIC PyPI — via GitHub Actions (Trusted Publishing/OIDC).
# =====================================================================
# Only emitted when `publishToPublicPyPI` is set (separate lever from the
# internal-feed publish above). It resolves the build's branch + commit (ADO
# REST) and reads the EXACT version from the wheel CI built — so public PyPI
# carries the same version as the internal feed (release, or .devN prerelease),
# never a stripped-to-clean surprise. It then:
#   - non-master build       -> skips (green): the GitHub Action is never fired
#     just to refuse.
#   - version already on PyPI -> ends YELLOW (SucceededWithIssues): the
#     at-most-once semantic hit an existing version; no failure, no no-op run.
#   - new master version     -> POSTs the repository_dispatch (sha + version).
# dependsOn the emitted internal publish stages + condition: succeeded() =>
# no public publish on ANY ADO failure. Needs var group `github-dispatch`.
- ${{ if and(not(in(parameters.buildId, '', '0')), eq(parameters.publishToPublicPyPI, true)) }}:
  - stage: Publish_PublicPyPI
    displayName: '📣 Publish Python → PUBLIC PyPI (master, new version only)'
    dependsOn:
      - ${{ if eq(parameters.publishNuGet, true) }}:
        - Publish_NuGet
      - ${{ if eq(parameters.publishNpm, true) }}:
        - Publish_NPM
      - ${{ if eq(parameters.publishPython, true) }}:
        - Publish_Python
    condition: succeeded()
    variables:
      - group: github-dispatch          # supplies secret GITHUB_DISPATCH_TOKEN
    jobs:
    - job: dispatch
      displayName: 'repository_dispatch → UiPath/coreipc'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: none
        # The published version = the EXACT version of the wheel CI built, so
        # public PyPI matches the internal feed. Pull that artifact to read it.
        - task: DownloadPipelineArtifact@2
          displayName: 'Download Python package from build ${{ parameters.buildId }}'
          inputs:
            buildType: specific
            project: $(System.TeamProject)
            pipeline: $(resources.pipeline.ci.pipelineID)
            buildVersionToDownload: specific
            buildId: ${{ parameters.buildId }}
            artifactName: 'Python package'
            targetPath: '$(Pipeline.Workspace)/pypkg'
        - script: |
            set -euo pipefail
            # 1. Resolve the build's branch + commit (ADO REST).
            build=$(curl -sSf -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
              "${SYSTEM_COLLECTIONURI}${SYSTEM_TEAMPROJECT}/_apis/build/builds/${BUILD_ID}?api-version=7.1")
            SHA=$(printf '%s' "$build" | jq -r '.sourceVersion')
            BRANCH=$(printf '%s' "$build" | jq -r '.sourceBranch')
            echo "buildId ${BUILD_ID}: branch=${BRANCH} commit=${SHA}"

            # 2. GATE — public PyPI gets MASTER builds only. Anything else: skip
            #    (green) so the GitHub Action is never triggered just to refuse.
            if [ "$BRANCH" != "refs/heads/master" ]; then
              echo "Not a master build (${BRANCH}) — skipping public PyPI dispatch."
              exit 0
            fi
            if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
              echo "##vso[task.logissue type=error]No valid commit SHA for buildId ${BUILD_ID} (got '${SHA}')."
              exit 1
            fi

            # 3. Read the EXACT version from the wheel CI built (from its
            #    metadata, so it is un-escaped): release or .devN prerelease.
            WHEEL=$(ls "$PYPKG_DIR"/*.whl 2>/dev/null | head -1 || true)
            if [ -z "$WHEEL" ]; then
              echo "##vso[task.logissue type=error]No wheel found in the Python artifact."
              exit 1
            fi
            VERSION=$(unzip -p "$WHEEL" '*.dist-info/METADATA' | sed -n 's/^Version: //p' | head -1)
            if [ -z "$VERSION" ]; then
              echo "##vso[task.logissue type=error]Could not read Version from the wheel metadata."
              exit 1
            fi
            echo "Wheel version: ${VERSION}"

            # 4. GATE — at-most-once. If PyPI already has this version, end
            #    YELLOW (SucceededWithIssues) to flag the collision; do NOT fail,
            #    and do NOT fire a no-op GitHub Action run.
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/uipath-ipc/${VERSION}/json")
            if [ "$code" = "200" ]; then
              echo "##vso[task.logissue type=warning]uipath-ipc ${VERSION} is already on PyPI — at-most-once: skipping public publish."
              echo "##vso[task.complete result=SucceededWithIssues;]already on PyPI"
              exit 0
            fi

            # 5. New master version → whisper to GitHub to publish it.
            echo "Dispatching publish-pypi for uipath-ipc ${VERSION} (${SHA})"
            curl -sSf -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_DISPATCH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/UiPath/coreipc/dispatches \
              -d "{\"event_type\":\"publish-pypi\",\"client_payload\":{\"sha\":\"${SHA}\",\"version\":\"${VERSION}\"}}"
          displayName: 'Gate on master + version, then dispatch'
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            SYSTEM_COLLECTIONURI: $(System.CollectionUri)
            SYSTEM_TEAMPROJECT: $(System.TeamProject)
            BUILD_ID: ${{ parameters.buildId }}
            GITHUB_DISPATCH_TOKEN: $(GITHUB_DISPATCH_TOKEN)
            PYPKG_DIR: $(Pipeline.Workspace)/pypkg
