parameters:
  # Push the nupkg to the uipath-ipc-deps feed, for a build that another repo's CI has to consume before it is released.
  - name: pushNuGetToTestFeed
    type: boolean
    default: false

steps:
  - task: CopyFiles@2
    displayName: '$(Label_DotNet) Copy nupkg to $(Build.ArtifactStagingDirectory)'
    inputs:
      SourceFolder: 'src\UiPath.CoreIpc\bin\$(DotNet_BuildConfiguration)\'
      Contents: '*.*nupkg'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
      CleanTargetFolder: true

  - task: PublishBuildArtifacts@1
    displayName: '$(Label_DotNet) Publish the $(DotNet_ArtifactName) to the pipeline instance'
    inputs:
      ArtifactName: '$(DotNet_ArtifactName)'
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactType: 'Container'

  # The `dotnet nuget push` step previously lived here and fired on every
  # build (condition: succeeded). It now lives in
  # `azp-nuget.publish.steps.yaml` under the Publish_NuGet stage, gated on
  # the `publishNuGet` pipeline parameter so publishing is opt-in.

  - ${{ if eq(parameters.pushNuGetToTestFeed, true) }}:
    - task: DotNetCoreCLI@2
      displayName: '$(Label_DotNet) dotnet push to uipath-ipc-deps'
      inputs:
        command: push
        packagesToPush: '$(Build.ArtifactStagingDirectory)/*.nupkg'
        publishVstsFeed: 'CoreIpc/uipath-ipc-deps'

  - task: PublishSymbols@2
    displayName: 'Publish Symbols to UiPath Azure Artifacts Symbol Server'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    inputs:
      symbolsFolder: $(Build.SourcesDirectory)
      searchPattern: '**/UiPath.CoreIpc/bin/**/UiPath.CoreIpc.pdb'
      symbolServerType: teamServices
      indexSources: false
