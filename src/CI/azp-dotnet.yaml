parameters:
  # Authenticode-sign UiPath.Ipc.dll (every TFM) before packing, then NuGet-sign the .nupkg.
  - name: sign
    type: boolean
    default: false

steps:
  # GeneratePackageOnBuild is off here: the DLLs get signed first, then packed below.
  - task: DotNetCoreCLI@2
    displayName: '$(Label_DotNet) Restore and build'
    inputs:
      projects: '$(DotNet_SessionSolution)'
      arguments: '--configuration $(DotNet_BuildConfiguration) -p:Version="$(FullVersion)" -p:DefineConstantsEx="CI" -p:GeneratePackageOnBuild=false'
      
  # WebSocket transport tests are excluded on CI: the net461 WebSocket server
  # (System.Net.HttpListener) throws from WebSocketStream.ReadAsync during
  # connection teardown on hosted agents and CRASHES the test host process
  # ("Test host process crashed" — e.g. build 12366871: 86 pass, then the
  # net461 run dies mid-WebSocket and blame-hang collects a dump 10 min later).
  # It's pre-existing HttpListener-on-hosted-agent flakiness, orthogonal to
  # this work; NamedPipe + TCP keep full coverage on both TFMs, and the
  # WebSocket tests still run locally. TODO: re-enable once the WebSocket
  # teardown is made hosted-agent-safe (or moved off HttpListener).
  #
  # --blame-hang is the backstop: if anything else wedges, vstest aborts after
  # the timeout, names the in-flight test(s), and attaches mini dumps. The
  # step/job timeouts catch a wedge outside vstest itself.
  - task: DotNetCoreCLI@2
    displayName: '$(Label_DotNet) Run unit tests'
    timeoutInMinutes: 20
    inputs:
      command: 'test'
      projects: '$(DotNet_SessionSolution)'
      publishTestResults: true
      testRunTitle: '.NET tests'
      arguments: '--no-build --configuration $(DotNet_BuildConfiguration) --filter "FullyQualifiedName!~WebSocket" --logger "console;verbosity=detailed" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini -p:Version="$(FullVersion)" -p:DefineConstantsEx="CI"'

  - ${{ if eq(parameters.sign, true) }}:
    # One UiPath.Ipc.dll per target framework in src/TargetFrameworks.props, and none built outside that list.
    - pwsh: |
        $tfms = ([xml](Get-Content '$(Build.SourcesDirectory)/src/TargetFrameworks.props' -Raw)).Project.PropertyGroup.ChildNodes |
          Where-Object NodeType -eq 'Element' | ForEach-Object { $_.InnerText.Trim() }
        $bin = '$(Build.SourcesDirectory)/src/UiPath.CoreIpc/bin/$(DotNet_BuildConfiguration)'
        $paths = $tfms | ForEach-Object { "$bin/$_/UiPath.Ipc.dll" }
        $missing = $paths | Where-Object { -not (Test-Path $_) }
        if ($missing) { throw "Not built: $($missing -join ', ')" }
        $built = @(Get-ChildItem "$bin/*/UiPath.Ipc.dll").Count
        if ($built -ne $paths.Count) { throw "Built $built UiPath.Ipc.dll, TargetFrameworks.props lists $($paths.Count)." }
        Write-Host "##vso[task.setvariable variable=SignPaths]$($paths -join ',')"
      displayName: 'List the DLLs to sign'
    - template: Signing/signing.yml@common
      parameters:
        azureConnectionName: ${{ variables.Signing_AzureConnectionName }}
        runInParallel: true
        pathsToSign:
          - '$(SignPaths)'

  # Same output folder the csproj used to pack into, so azp-dotnet-dist.yaml picks it up unchanged.
  - task: DotNetCoreCLI@2
    displayName: '$(Label_DotNet) Pack'
    inputs:
      command: 'pack'
      packagesToPack: '$(DotNet_MainProjectPath)'
      configurationToPack: '$(DotNet_BuildConfiguration)'
      nobuild: true
      versioningScheme: 'off'
      buildProperties: 'Version=$(FullVersion)'
      packDirectory: '$(Build.SourcesDirectory)/src/UiPath.CoreIpc/bin/$(DotNet_BuildConfiguration)'

  # The tools and Key Vault variables from the first signing block are still in the job.
  - ${{ if eq(parameters.sign, true) }}:
    - template: Signing/signing.yml@common
      parameters:
        azureConnectionName: ${{ variables.Signing_AzureConnectionName }}
        runSetUpSteps: false
        runInParallel: true
        pathsToSign:
          - '$(Build.SourcesDirectory)/src/UiPath.CoreIpc/bin/$(DotNet_BuildConfiguration)/*.nupkg'