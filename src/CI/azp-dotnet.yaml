parameters:
  # Authenticode-sign UiPath.CoreIpc.dll (every TFM) before packing, then NuGet-sign the .nupkg.
  - name: sign
    type: boolean
    default: false
  # Template expressions here can't see azp-start.yaml's variables, so the caller passes it in.
  - name: signingConnection
    type: string
    default: ''

steps:
  # GeneratePackageOnBuild is off here: the DLLs get signed first, then packed below.
  - task: DotNetCoreCLI@2
    displayName: '$(Label_DotNet) Restore and build'
    inputs:
      projects: '$(DotNet_SessionSolution)'
      arguments: '--configuration $(DotNet_BuildConfiguration) -p:Version="$(FullVersion)" -p:DefineConstantsEx="CI" -p:GeneratePackageOnBuild=false'
      
  - task: DotNetCoreCLI@2
    displayName: '$(Label_DotNet) Run unit tests'
    inputs:
      command: 'test'
      projects: '**/*Tests*.csproj'
      publishTestResults: true
      testRunTitle: '.NET tests'
      arguments: '--no-build --configuration $(DotNet_BuildConfiguration) --logger "console;verbosity=detailed"'

  - ${{ if eq(parameters.sign, true) }}:
    # One UiPath.CoreIpc.dll per target framework in src/TargetFrameworks.props, and none built outside that list.
    - pwsh: |
        $tfms = ([xml](Get-Content '$(Build.SourcesDirectory)/src/TargetFrameworks.props' -Raw)).Project.PropertyGroup.ChildNodes |
          Where-Object NodeType -eq 'Element' | ForEach-Object { $_.InnerText.Trim() }
        $bin = '$(Build.SourcesDirectory)/src/UiPath.CoreIpc/bin/$(DotNet_BuildConfiguration)'
        $paths = $tfms | ForEach-Object { "$bin/$_/UiPath.CoreIpc.dll" }
        $missing = $paths | Where-Object { -not (Test-Path $_) }
        if ($missing) { throw "Not built: $($missing -join ', ')" }
        $built = @(Get-ChildItem "$bin/*/UiPath.CoreIpc.dll").Count
        if ($built -ne $paths.Count) { throw "Built $built UiPath.CoreIpc.dll, TargetFrameworks.props lists $($paths.Count)." }
        Write-Host "##vso[task.setvariable variable=SignPaths]$($paths -join ',')"
      displayName: 'List the DLLs to sign'
    - template: Signing/signing.yml@common
      parameters:
        azureConnectionName: ${{ parameters.signingConnection }}
        runInParallel: true
        pathsToSign:
          - '$(SignPaths)'

  # Same output folder the csproj used to pack into, so azp-dotnet-dist.yaml picks it up unchanged.
  - task: DotNetCoreCLI@2
    displayName: '$(Label_DotNet) Pack'
    inputs:
      command: 'pack'
      packagesToPack: '$(DotNet_MainProjectPath)'
      configurationToPack: '$(DotNet_BuildConfiguration)'
      nobuild: true
      versioningScheme: 'off'
      buildProperties: 'Version=$(FullVersion)'
      packDirectory: '$(Build.SourcesDirectory)/src/UiPath.CoreIpc/bin/$(DotNet_BuildConfiguration)'

  # The tools and Key Vault variables from the first signing block are still in the job.
  - ${{ if eq(parameters.sign, true) }}:
    - template: Signing/signing.yml@common
      parameters:
        azureConnectionName: ${{ parameters.signingConnection }}
        runSetUpSteps: false
        runInParallel: true
        pathsToSign:
          - '$(Build.SourcesDirectory)/src/UiPath.CoreIpc/bin/$(DotNet_BuildConfiguration)/*.nupkg'
